<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" >
<head>
    <th:block th:include="include :: header('修改推荐武器')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="white-bg">
    <div class="wrapper wrapper-content animated fadeInRight ibox-content">
        <form class="form-horizontal m" id="form-recommendWeapon-edit" th:object="${genshinRecommendWeapon}">
            <input name="id" th:field="*{id}" type="hidden">
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">角色：</label>
                    <div class="col-sm-8">
                        <select name="characterId" class="form-control" required>
                            <option value="">--- 请选择角色 ---</option>
                            <option th:each="character : ${characterList}" 
                                    th:value="${character.id}" 
                                    th:text="${character.name}"
                                    th:selected="${character.id == genshinRecommendWeapon.characterId}"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label is-required">推荐武器：</label>
                    <div class="col-sm-8">
                        <select name="weaponId" class="form-control" required>
                            <option value="">--- 请选择武器 ---</option>
                            <option th:each="weapon : ${weaponList}" 
                                    th:value="${weapon.id}" 
                                    th:text="${weapon.name}"
                                    th:selected="${weapon.id == genshinRecommendWeapon.weaponId}"></option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">推荐梯度：</label>
                    <div class="col-sm-8">
                        <select name="recommendDegree" class="form-control">
                            <option value="">--- 请选择梯度 ---</option>
                            <option value="T0" th:selected="${genshinRecommendWeapon.recommendDegree == 'T0'}">T0专武</option>
                            <option value="T1" th:selected="${genshinRecommendWeapon.recommendDegree == 'T1'}">T1极佳</option>
                            <option value="T2" th:selected="${genshinRecommendWeapon.recommendDegree == 'T2'}">T2过渡</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="col-xs-12">
                <div class="form-group">
                    <label class="col-sm-3 control-label">推荐理由/手法说明：</label>
                    <div class="col-sm-8">
                        <textarea name="remark" class="form-control">[[*{remark}]]</textarea>
                    </div>
                </div>
            </div>
        </form>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var prefix = ctx + "system/recommendWeapon";
        $('select').select2();
        $("#form-recommendWeapon-edit").validate({
            focusCleanup: true
        });

        function submitHandler() {
            if ($.validate.form()) {
                $.operate.save(prefix + "/edit", $('#form-recommendWeapon-edit').serialize());
            }
        }
    </script>
</body>
</html>
