<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org" xmlns:shiro="http://www.pollix.at/thymeleaf/shiro">
<head>
    <th:block th:include="include :: header('原神武器管理列表')" />
    <th:block th:include="include :: select2-css" />
</head>
<body class="gray-bg">
     <div class="container-div">
        <div class="row">
            <div class="col-sm-12 search-collapse">
                <form id="formId">
                    <div class="select-list">
                        <ul>
                            <li>
                                <label>武器名称：</label>
                                <input type="text" name="name"/>
                            </li>
                            <li>
                                <label>武器类型：</label>
                                <select name="weaponText" class="form-control" onchange="$.table.search()">
                                    <option value="">所有</option>
                                    <option value="单手剑">单手剑</option>
                                    <option value="双手剑">双手剑</option>
                                    <option value="长柄武器">长柄武器</option>
                                    <option value="弓">弓</option>
                                    <option value="法器">法器</option>
                                </select>
                            </li>
                            <li>
                                <label>星级：</label>
                                <select name="rarity" class="form-control" onchange="$.table.search()">
                                    <option value="">所有</option>
                                    <option value="5">5星</option>
                                    <option value="4">4星</option>
                                    <option value="3">3星</option>
                                    <option value="2">2星</option>
                                    <option value="1">1星</option>
                                </select>
                            </li>
                            <li>
                                <a class="btn btn-primary btn-rounded btn-sm" onclick="$.table.search()"><i class="fa fa-search"></i>&nbsp;搜索</a>
                                <a class="btn btn-warning btn-rounded btn-sm" onclick="$.form.reset()"><i class="fa fa-refresh"></i>&nbsp;重置</a>
                            </li>
                        </ul>
                    </div>
                </form>
            </div>

            <div class="btn-group-sm" id="toolbar" role="group">
                <a class="btn btn-success" onclick="$.operate.add()" shiro:hasPermission="system:weapon:add">
                    <i class="fa fa-plus"></i> 添加
                </a>
                <a class="btn btn-primary single disabled" onclick="$.operate.edit()" shiro:hasPermission="system:weapon:edit">
                    <i class="fa fa-edit"></i> 修改
                </a>
                <a class="btn btn-danger multiple disabled" onclick="$.operate.removeAll()" shiro:hasPermission="system:weapon:remove">
                    <i class="fa fa-remove"></i> 删除
                </a>
                <a class="btn btn-warning" onclick="$.table.exportExcel()" shiro:hasPermission="system:weapon:export">
                    <i class="fa fa-download"></i> 导出
                </a>
            </div>
            <div class="col-sm-12 select-table table-striped">
                <table id="bootstrap-table"></table>
            </div>
        </div>
    </div>
    <th:block th:include="include :: footer" />
    <th:block th:include="include :: select2-js" />
    <script th:inline="javascript">
        var editFlag = [[${@permission.hasPermi('system:weapon:edit')}]];
        var removeFlag = [[${@permission.hasPermi('system:weapon:remove')}]];
        var prefix = ctx + "system/weapon";

        $(function() {
            $('select').select2();
            var options = {
                url: prefix + "/list",
                createUrl: prefix + "/add",
                updateUrl: prefix + "/edit/{id}",
                removeUrl: prefix + "/remove",
                exportUrl: prefix + "/export",
                modalName: "原神武器信息",
                columns: [{
                    checkbox: true
                },
                {
                    field: 'id',
                    title: '武器ID',
                    visible: false
                },
                {
                    field: 'name',
                    title: '武器名称',
                    sortable: true
                },
                {
                    field: 'weaponText',
                    title: '武器类型',
                    sortable: true
                },
                {
                    field: 'rarity',
                    title: '星级',
                    sortable: true,
                    formatter: function(value, row, index) {
                        var stars = '';
                        for (var i = 0; i < value; i++) {
                            stars += '⭐';
                        }
                        return stars;
                    }
                },
                {
                    field: 'baseAtkValue',
                    title: '基础攻击力',
                    sortable: true
                },
                {
                    field: 'mainStatText',
                    title: '主属性'
                },
                {
                    field: 'baseStatText',
                    title: '属性数值'
                },
                {
                    field: 'effectName',
                    title: '武器效果'
                },
                {
                    title: '操作',
                    align: 'center',
                    formatter: function(value, row, index) {
                        var actions = [];
                        actions.push('<a class="btn btn-success btn-xs ' + editFlag + '" href="javascript:void(0)" onclick="$.operate.edit(\'' + row.id + '\')"><i class="fa fa-edit"></i>编辑</a> ');
                        actions.push('<a class="btn btn-danger btn-xs ' + removeFlag + '" href="javascript:void(0)" onclick="$.operate.remove(\'' + row.id + '\')"><i class="fa fa-remove"></i>删除</a>');
                        return actions.join('');
                    }
                }]
            };
            $.table.init(options);
        });
    </script>
</body>
</html>
